<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Comunitária</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Biblioteca Comunitária</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">#</a></li>
        </ul>
    </nav>
    <main>
        <h2>Empréstimo de Livros</h2>
    </main>
    <section>
        <img src="library-488690.webp" alt="Corredor de Livros">
        <h3>Reserve seu livro favorito gratuitamente.</h3>
    </section>
    <form>
        <label for="nome-usuario">Seu Nome:</label>
        <input type="text" id="nome-usuario">
        <br>
        <br>
        <label for="email-user">Seu E-mail:</label>
        <input type="email" id="email-user" required>
    </form>
    <br>
    <fieldset>
        <legend>Tipos de Retirada:</legend>
        <input type="checkbox" id="retirar-livro" name="Livros" value="retirar">
        <label for="retirar-livro">Rerirar no balcão</label><br>

        <input type="checkbox" id="entrega-ca" name="entrega" value="casa">
        <label for="entrega-ca">Entrega em casa</label>
    </fieldset>
        <br>
    <fieldset>
         <legend>Gêneros Favoritos:</legend>
         <input type="checkbox" id="ficcao-aqui" name="ficcao" value="aqui">
         <label for="ficcao-aqui">Ficção</label><br>

         <input type="checkbox" id="tec-mais" name="tecnologia" value="facilidade">
         <label for="tec-mais">Tecnologia</label>
    </fieldset><br>

    <button type="submit">Confirmar Reserva</button>

    <footer> 
         <p>© 2026 Desenvolvido pela Turma de PCDs 2026.</p> 
</footer> 

</body>
</html>
